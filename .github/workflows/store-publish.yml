name: Mobile Release & Google Play Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to verify/build'
        required: true
        default: 'android'
        type: choice
        options: [android, ios, all]
      track:
        description: 'Google Play track (Android only)'
        required: true
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]
      publish_android:
        description: 'Upload the signed AAB to Google Play'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  android:
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve Android release metadata
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "track=production" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "track=${{ github.event.inputs.track || 'internal' }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ github.event.inputs.publish_android || 'false' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail closed unless production build secrets exist
        shell: bash
        run: |
          required=(
            VITE_SUPABASE_URL
            VITE_SUPABASE_PUBLISHABLE_KEY
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required Android release secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install verified dependencies
        run: npm ci

      - name: Run complete release gate
        run: npm run verify

      - name: Build web and sync Android
        env:
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: npm run build:android

      - name: Configure Android release signing
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/app/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed Android App Bundle
        working-directory: android
        env:
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
        run: ./gradlew clean bundleRelease

      - name: Verify signed bundle exists
        shell: bash
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          test -s android/app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: aibltycode-android-${{ steps.release.outputs.version_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Require Google Play service account for publishing
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required to publish to Google Play."
            exit 1
          fi

      - name: Publish signed AAB to Google Play
        if: steps.release.outputs.publish == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aibltycode.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.release.outputs.track }}
          status: completed
          inAppUpdatePriority: 2

  ios-verification:
    if: github.event_name != 'push' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios')
    runs-on: macos-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Require web runtime configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build web and sync iOS
        run: npm run build:ios
      - name: Verify native iOS project without App Store signing
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
