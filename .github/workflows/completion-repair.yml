name: Completion Repair

on:
  push:
    branches:
      - build/aibltycode-complete-2026-08-30

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v6
        with:
          ref: build/aibltycode-complete-2026-08-30
          fetch-depth: 0

      - name: Apply exact safe repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          curriculum = Path('src/data/moduleDataExtra.ts')
          text = curriculum.read_text()
          replacements = {
              'L("js-variables",': 'L("jsweb-variables",',
              'L("js-operators",': 'L("jsweb-operators",',
              'L("js-functions",': 'L("jsweb-functions",',
              'L("js-arrays",': 'L("jsweb-arrays",',
              'L("js-objects",': 'L("jsweb-objects",',
              'L("js-events",': 'L("jsweb-events",',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count not in (0, 1):
                  raise SystemExit(f'Expected 0 or 1 occurrence of {old}, found {count}')
              text = text.replace(old, new)
          curriculum.write_text(text)

          retention = Path('src/data/retentionEngine.ts')
          text = retention.read_text()
          old = 'passed: words.length >= minWords && keywordMatches.length >= Math.min(minKeywordMatches, Math.max(expectedKeywords.length, 1)),'
          new = 'passed: words.length >= minWords && (expectedKeywords.length === 0 || keywordMatches.length >= Math.min(minKeywordMatches, expectedKeywords.length)),'
          if old in text:
              text = text.replace(old, new)
          retention.write_text(text)

          dashboard = Path('src/pages/Dashboard.tsx')
          text = dashboard.read_text()
          import_anchor = 'import DailyChallenges from "@/components/dashboard/DailyChallenges";\n'
          review_import = 'import { ReviewDueBanner } from "@/components/dashboard/ReviewDueBanner";\n'
          if review_import not in text:
              if import_anchor not in text:
                  raise SystemExit('Dashboard import anchor not found')
              text = text.replace(import_anchor, import_anchor + review_import, 1)
          main_anchor = '      <main className="container mx-auto px-4 pt-24 pb-12 max-w-4xl">\n'
          review_banner = '        <ReviewDueBanner />\n'
          if review_banner not in text:
              if main_anchor not in text:
                  raise SystemExit('Dashboard main anchor not found')
              text = text.replace(main_anchor, main_anchor + review_banner, 1)
          dashboard.write_text(text)

          validator = Path('scripts/validate-curriculum.mjs')
          text = validator.read_text()
          if "const reviewDueBanner = read('src/components/dashboard/ReviewDueBanner.tsx');" not in text:
              anchor = "const retentionGate = read('src/components/lessons/RetentionGate.tsx');\n"
              if anchor not in text:
                  raise SystemExit('Validator retention anchor not found')
              text = text.replace(anchor, anchor + "const reviewDueBanner = read('src/components/dashboard/ReviewDueBanner.tsx');\n", 1)
          checks_anchor = "assert(retentionEngine.includes('retentionEngineSelfTest'), 'retention scheduling self-test exists');\n"
          new_checks = (
              "assert(dashboard.includes('ReviewDueBanner'), 'dashboard surfaces autonomous due-review reminders');\n"
              "assert(reviewDueBanner.includes('getDueLocalReviews'), 'dashboard review reminder reads due retention schedule');\n"
              "assert(reviewDueBanner.includes('/game/spaced-rep'), 'dashboard review reminder opens universal review queue');\n"
          )
          if new_checks not in text:
              if checks_anchor not in text:
                  raise SystemExit('Validator review check anchor not found')
              text = text.replace(checks_anchor, checks_anchor + new_checks, 1)
          validator.write_text(text)
          PY

      - name: Commit repairs when required
        run: |
          if git diff --quiet; then
            echo "No completion repair required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/moduleDataExtra.ts src/data/retentionEngine.ts src/pages/Dashboard.tsx scripts/validate-curriculum.mjs
          git commit -m "feat: surface autonomous review schedule and lock retention checks"
          git push origin HEAD:build/aibltycode-complete-2026-08-30
