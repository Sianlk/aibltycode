name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Prefer repository secrets when present. The fallbacks are the same browser-
      # safe public values already embedded in the client so first deployment can
      # bootstrap without Lovable's environment injection.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://lzeebofvztpwfzfrxthl.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYXNlIiwicmVmIjoibHplZWJvZnZ6dHB3ZnpmeHh0aGwiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc2NTEzODE5MywiZXhwIjoyMDgwNzE0MTkzfQ.J6ezgbicgmITdnkPd6UGMcpDdT1ggDNNWV-alTbzQzg' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run verify

      - name: Add SPA fallback
        shell: bash
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
