name: Optional FastAPI Backend CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - build/aibltycode-complete-2026-08-30
    paths:
      - "api/**"
      - "tests/**/*.py"
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "tests/**/*.py"
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: test_secret_key_64_chars_minimum_for_security_requirements_ok

    steps:
      - uses: actions/checkout@v6
      - name: Verify checked-out release source
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "Tracked tests:"
          git ls-files tests
          echo "ASGI test transport:"
          grep -n "ASGITransport" tests/conftest.py || true
          test ! -e tests/test_user_logic.py
          test ! -d backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Confirm dependency resolution
        run: pip check
      - name: Smoke-test canonical backend imports
        run: python -c "import slowapi; import api.main"
      - name: API health contract
        run: pytest tests/test_api.py::test_health -v
      - name: API weak-password validation
        run: pytest tests/test_api.py::test_register_validates_password -v
      - name: API username validation
        run: pytest tests/test_api.py::test_register_validates_username -v
      - name: API invalid-login contract
        run: pytest tests/test_api.py::test_login_invalid_credentials -v
      - name: API protected-route contract
        run: pytest tests/test_api.py::test_protected_route_requires_auth -v
      - name: API rate-limit contract
        run: pytest tests/test_api.py::test_rate_limit_headers -v
      - name: Authentication tests
        run: pytest tests/test_auth.py -v
      - name: Health tests
        run: pytest tests/test_health.py -v
      - name: Payment tests
        run: pytest tests/test_payments.py -v
      - name: Unit and security smoke tests
        run: pytest tests/test_unit.py -v
      - name: Run full backend suite with coverage
        run: pytest tests/ -v --cov=api --cov-report=xml --cov-report=term-missing
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend quality tools
        run: pip install ruff bandit
      - name: Compile Python sources
        run: python -m compileall -q api tests
      - name: Ruff fatal-error gate
        run: ruff check --select E9,F63,F7,F82 api/ tests/
      - name: Bandit medium/high security gate
        run: bandit -r api/ -ll
