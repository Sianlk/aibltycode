name: AIBLTYCODE Complete Build

on:
  push:
    branches:
      - main
      - build/aibltycode-complete-2026-08-30
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Regenerate canonical dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        run: npm ci

      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Unit, curriculum, type, lint and production build gate
        run: npm run verify
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'public-anon-placeholder' }}

      - name: Sync regenerated lockfile to completion branch
        if: github.ref == 'refs/heads/build/aibltycode-complete-2026-08-30' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate canonical package lock [lock-sync]"
            git push
          fi